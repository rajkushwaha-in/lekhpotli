name: Claude Commit Review

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff for this push
        run: |
          if git cat-file -e "${{ github.event.before }}" 2>/dev/null && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff "${{ github.event.before }}" "${{ github.sha }}" > diff.txt
          else
            git show "${{ github.sha }}" > diff.txt
          fi
          # Cap the diff size so the review request stays a reasonable size.
          head -c 60000 diff.txt > diff_trunc.txt
          if [ "$(wc -c < diff.txt)" -gt 60000 ]; then
            echo -e "\n\n[diff truncated - too large to include in full]" >> diff_trunc.txt
          fi

      - name: Review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import urllib.request

          # errors="replace" guards against the byte-based `head -c` truncation
          # having split a multi-byte UTF-8 character at the cut point.
          with open("diff_trunc.txt", errors="replace") as f:
              diff = f.read()

          if not diff.strip():
              review_text = "No changes to review (empty diff)."
          else:
              payload = {
                  "model": "claude-opus-4-8",
                  "max_tokens": 2000,
                  "thinking": {"type": "adaptive"},
                  "system": (
                      "You are a meticulous senior code reviewer. Review the given git diff "
                      "for correctness bugs, security issues, and notable code quality problems. "
                      "Be concise and use markdown. Cite specific lines/files. If nothing "
                      "significant stands out, say so briefly instead of inventing nitpicks."
                  ),
                  "messages": [{"role": "user", "content": diff}],
              }
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                      "anthropic-version": "2023-06-01",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      data = json.load(resp)
                  review_text = "".join(
                      b.get("text", "") for b in data.get("content", []) if b.get("type") == "text"
                  ) or "Claude returned no reviewable text."
              except urllib.error.HTTPError as e:
                  review_text = f"Review request failed ({e.code}): {e.read().decode()[:500]}"
              except urllib.error.URLError as e:
                  review_text = f"Review request failed (network/timeout): {e.reason}"

          body = review_text + "\n\n---\n🤖 Automated review by Claude"
          subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
               "-f", f"body={body}"],
              check=True,
          )
          PYEOF
