name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" > diff.txt
          # Cap the diff size so the review request stays a reasonable size.
          head -c 60000 diff.txt > diff_trunc.txt
          if [ "$(wc -c < diff.txt)" -gt 60000 ]; then
            echo -e "\n\n[diff truncated - too large to include in full]" >> diff_trunc.txt
          fi

      - name: Review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import urllib.request

          # errors="replace" guards against the byte-based `head -c` truncation
          # having split a multi-byte UTF-8 character at the cut point.
          with open("diff_trunc.txt", errors="replace") as f:
              diff = f.read()

          if not diff.strip():
              review_text = "No changes to review (empty diff)."
          else:
              payload = {
                  "model": "claude-opus-4-8",
                  "max_tokens": 4096,
                  "thinking": {"type": "adaptive"},
                  "system": (
                      "You are a meticulous senior code reviewer. Review the given git diff "
                      "for correctness bugs, security issues, and notable code quality problems. "
                      "Be concise and use markdown. Cite specific lines/files. If nothing "
                      "significant stands out, say so briefly instead of inventing nitpicks. "
                      "This review is advisory only for a human who will decide whether to merge."
                  ),
                  "messages": [{"role": "user", "content": diff}],
              }
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                      "anthropic-version": "2023-06-01",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      data = json.load(resp)
                  review_text = "".join(
                      b.get("text", "") for b in data.get("content", []) if b.get("type") == "text"
                  ) or (
                      f"Claude returned no reviewable text (stop_reason={data.get('stop_reason')}). "
                      "This usually means max_tokens was hit before any visible text was written "
                      "(e.g. the whole budget went to thinking) - consider raising max_tokens."
                  )
              except urllib.error.HTTPError as e:
                  review_text = f"Review request failed ({e.code}): {e.read().decode()[:500]}"
              except urllib.error.URLError as e:
                  review_text = f"Review request failed (network/timeout): {e.reason}"

          body = (
              review_text
              + "\n\n---\n🤖 Automated advisory review by Claude. "
              + "A human must still approve and merge this PR."
          )
          subprocess.run(
              [
                  "gh", "api",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}/reviews",
                  "-f", f"body={body}",
                  "-f", "event=COMMENT",
              ],
              check=True,
          )
          PYEOF
