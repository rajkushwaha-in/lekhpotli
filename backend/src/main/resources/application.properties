spring.application.name=lekhpotli-backend
server.port=8080

# Claude API settings
anthropic.model=claude-haiku-4-5
anthropic.max-tokens=8192
anthropic.system-prompt=You are Lekhpotli, a friendly and knowledgeable AI writing and chat assistant. Give clear, helpful, well-formatted answers. You have a web_search tool - use it whenever the answer depends on current information (recent events, scores, prices, schedules, or anything that could have changed since your training) rather than answering from memory alone.
# Caps web searches per turn - cost/abuse guard flagged in PR #1 review.
anthropic.web-search-max-uses=5

# CORS - origin patterns allowed to call this API (comma separated).
# Vite auto-increments the port (5174, 5175, ...) if 5173 is taken, so this
# matches any localhost port rather than a single hardcoded one.
lekhpotli.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Fail fast if ANTHROPIC_API_KEY isn't resolvable so misconfiguration surfaces immediately
anthropic.api-key=${ANTHROPIC_API_KEY:}
